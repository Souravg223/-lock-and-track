{% extends "layout.html" %}

{% block title %}Login - Smart Book Recommender{% endblock %}

{% block content %}
<div class="form-container">
    <h2 style="text-align: center; margin-bottom: 2rem;">Welcome Back</h2>
    <form method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn-primary" style="width: 100%; font-size: 1.1rem; cursor: pointer; border-radius: 30px;">Login</button>
    </form>
    <p style="text-align: center; margin-top: 1.5rem;">
        Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary-color);">Register</a>
    </p>
</div>
{% endblock %}
